<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 280" width="860" height="280" role="img" aria-label="raise-the-bar: Claude Code plugins. Let the agent write the code. Keep the decision to ship.">
  <title>raise-the-bar</title>
  <style>
    .sans { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    /* The bar rises. What does not reach it goes grey. Without animation the picture shows the end. */
    .bar { animation: rise 9s linear infinite; }
    .low1 { animation: low1 9s linear infinite; }
    .low2 { animation: low2 9s linear infinite; }
    .ok { animation: ok 9s linear infinite; }
    @keyframes rise {
      0% { transform: translateY(84px); opacity: 0; }
      6% { transform: translateY(84px); opacity: 1; }
      40%, 94% { transform: translateY(0); opacity: 1; }
      100% { transform: translateY(0); opacity: 0; }
    }
    @keyframes low1 { 0%, 21% { opacity: 0; } 24%, 96% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes low2 { 0%, 35% { opacity: 0; } 38%, 96% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes ok { 0%, 42% { opacity: 0; } 47%, 94% { opacity: 1; } 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .bar, .low1, .low2, .ok { animation: none; } }
  </style>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#1b2129" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="81%" cy="52%" r="46%">
      <stop offset="0" stop-color="#56d4dd" stop-opacity=".16"/>
      <stop offset="1" stop-color="#56d4dd" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="col" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#56d4dd"/>
      <stop offset="1" stop-color="#1c6f7c"/>
    </linearGradient>
    <clipPath id="frame"><rect width="860" height="280" rx="12"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="860" height="280" fill="#0d1117"/>
    <rect width="860" height="280" fill="url(#grid)"/>
    <rect width="860" height="280" fill="url(#glow)"/>
  </g>
  <rect x=".5" y=".5" width="859" height="279" rx="12" fill="none" stroke="#30363d"/>

  <text x="48" y="66" class="mono" font-size="12.5" letter-spacing="2.2" fill="#56d4dd">CLAUDE CODE PLUGINS</text>
  <text x="46" y="130" class="sans" font-size="60" font-weight="800" letter-spacing="-1.5" fill="#f0f6fc">raise-the-<tspan fill="#56d4dd">bar</tspan></text>
  <text x="48" y="172" class="sans" font-size="19" fill="#b6c0cb">Let the agent write the code.</text>
  <text x="48" y="198" class="sans" font-size="19" font-weight="700" fill="#f0f6fc">Keep the decision to ship.</text>

  <g class="mono" font-size="12.5" fill="#e6edf3">
    <rect x="48" y="222" width="102" height="27" rx="13.5" fill="#161b22" stroke="#30363d"/>
    <text x="99" y="240" text-anchor="middle">guardrails</text>
    <rect x="160" y="222" width="64" height="27" rx="13.5" fill="#161b22" stroke="#30363d"/>
    <text x="192" y="240" text-anchor="middle">craft</text>
    <rect x="234" y="222" width="80" height="27" rx="13.5" fill="#161b22" stroke="#30363d"/>
    <text x="274" y="240" text-anchor="middle">council</text>
  </g>

  <!-- Five pieces of agent work. Three reach the bar. -->
  <g>
    <rect x="590" y="166" width="26" height="60" rx="3" fill="url(#col)"/>
    <rect x="636" y="76" width="26" height="150" rx="3" fill="url(#col)"/>
    <rect x="682" y="131" width="26" height="95" rx="3" fill="url(#col)"/>
    <rect x="728" y="56" width="26" height="170" rx="3" fill="url(#col)"/>
    <rect x="774" y="106" width="26" height="120" rx="3" fill="url(#col)"/>
    <rect class="low1" x="590" y="166" width="26" height="60" rx="3" fill="#30363d"/>
    <rect class="low2" x="682" y="131" width="26" height="95" rx="3" fill="#30363d"/>
    <line x1="574" y1="226.5" x2="822" y2="226.5" stroke="#30363d"/>
  </g>
  <g class="ok" fill="none" stroke="#3fb950" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M643 62l4.5 4.5l8-9"/>
    <path d="M735 42l4.5 4.5l8-9"/>
    <path d="M781 92l4.5 4.5l8-9"/>
  </g>
  <g class="bar">
    <line x1="574" y1="122" x2="822" y2="122" stroke="#f0f6fc" stroke-width="2.5" stroke-linecap="round"/>
    <text x="574" y="113" class="mono" font-size="11" letter-spacing="1" fill="#f0f6fc">THE BAR</text>
  </g>
  <text x="698" y="250" class="mono" font-size="11" fill="#7d8590" text-anchor="middle">agent-written changes</text>
</svg>
